<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: #f4f4f4;
}

/* FORM */
form {
    max-width: 210mm;
    margin: auto;
    background: white;
    padding: 20px;
    border: 1px solid #ddd;
    margin-bottom: 20px;
}

input, textarea {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
}

button {
    padding: 10px;
    background: #2c3e50;
    color: white;
    border: none;
    cursor: pointer;
}

/* RESUME */
.resume {
    width: 210mm;
    min-height: 297mm;
    margin: auto;
    background: white;
    padding: 15mm;
    border: 3px solid #2c3e50;
    font-size: 13px;
    display: none;
}

.header {
    background: #2c3e50;
    color: white;
    padding: 20px;
    position: relative;
    min-height: 125px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.header h1 {
    margin: 0;
    padding-right: 110px;
    overflow-wrap: break-word;
}

.header img {
    position: absolute;
    right: 20px;
    top: 20px;
    width: 85px;
    height: 85px;
    border-radius: 50%;
    object-fit: cover;
    background: #ddd;
}

.section {
    margin-top: 15px;
    margin-bottom: 15px;
}

.section h3 {
    border-bottom: 2px solid #333;
    padding-bottom: 3px;
    color: #2c3e50;
}

ul {
    padding-left: 18px;
}

p {
    margin: 4px 0;
    white-space: pre-line;
}

.download-btn {
    margin: 20px auto 0;
    display: block;
}

/* PRINT */
@media print {
    @page { size: A4; margin: 0; }

    html, body {
        margin: 0;
        padding: 0;
        background: white;
    }

    form, .download-btn {
        display: none !important;
    }

    .resume {
        display: block !important;
        border: none;
        width: 210mm;
        height: 297mm;
        overflow: hidden;
    }
}
</style>
</head>

<body>

<form id="resumeForm">
    <h2>Resume Builder</h2>

    <input type="text" id="name" placeholder="Full Name" required>
    <input type="file" id="profilePicInput" accept="image/*">

    <input type="text" id="phone" placeholder="Phone">
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="location" placeholder="Location">
    <input type="text" id="linkedin" placeholder="LinkedIn">

    <textarea id="objective" placeholder="Objective"></textarea>

    <input type="text" id="skills" placeholder="Skills (comma separated)">
    <input type="text" id="certifications" placeholder="Certifications (comma separated)">
    <input type="text" id="education" placeholder="Education">
    <input type="text" id="languages" placeholder="Languages (comma separated)">

    <textarea id="experience" placeholder="Experience"></textarea>
    <textarea id="projects" placeholder="Projects / Internships"></textarea>

    <button type="submit">Generate Resume</button>
</form>

<div class="resume" id="resume">

    <div class="header">
        <h1 id="resumeName"></h1>
        <img id="profilePic" style="display:none;">
    </div>

    <div class="section" id="secObjective">
        <h3>CAREER OBJECTIVE</h3>
        <p id="resumeObjective"></p>
    </div>

    <div class="section" id="secContact">
        <h3>CONTACT</h3>
        <p id="resumePhone"></p>
        <p id="resumeEmail"></p>
        <p id="resumeLocation"></p>
        <p id="resumeLinkedin"></p>
    </div>

    <div class="section" id="secSkills">
        <h3>SKILLS</h3>
        <ul id="resumeSkills"></ul>
    </div>

    <div class="section" id="secEducation">
        <h3>EDUCATION</h3>
        <p id="resumeEducation"></p>
    </div>

    <div class="section" id="secCertifications">
        <h3>CERTIFICATIONS</h3>
        <ul id="resumeCertifications"></ul>
    </div>

    <div class="section" id="secLanguages">
        <h3>LANGUAGES</h3>
        <ul id="resumeLanguages"></ul>
    </div>

    <div class="section" id="secExperience">
        <h3>EXPERIENCE</h3>
        <p id="resumeExperience"></p>
    </div>

    <div class="section" id="secProjects">
        <h3>PROJECTS / INTERNSHIPS</h3>
        <div id="resumeProjects"></div>
    </div>

    <button onclick="window.print()" class="download-btn">Download PDF</button>
</div>

<script>

/* IMAGE */
document.getElementById('profilePicInput').addEventListener('change', function(e){
    const file = e.target.files[0];
    const img = document.getElementById('profilePic');

    if(file){
        const reader = new FileReader();
        reader.onload = () => {
            img.src = reader.result;
            img.style.display = "block";
        };
        reader.readAsDataURL(file);
    } else {
        img.src = "";
        img.style.display = "none";
    }
});

/* TEXT FIELD */
function setText(id, value, prefix=""){
    const el = document.getElementById(id);
    el.textContent = value ? prefix + value : "";
}

/* LIST */
function setList(inputId, targetId){
    const value = document.getElementById(inputId).value.trim();
    const ul = document.getElementById(targetId);
    ul.innerHTML = "";

    if(!value) return;

    value.split(",").map(x => x.trim()).filter(Boolean)
        .forEach(item => {
            const li = document.createElement("li");
            li.textContent = item;
            ul.appendChild(li);
        });
}

/* PROJECTS (SAFE) */
function formatProjects(text){
    if(!text.trim()) return "";

    return text.split(/\n/).map(line => {
        line = line.trim();
        if(line.startsWith("-") || line.startsWith("•")){
            return "• " + line.replace(/^[-•]\s*/, "");
        }
        return "<b>" + line + "</b>";
    }).join("<br>");
}

/* SUBMIT */
document.getElementById("resumeForm").addEventListener("submit", function(e){
    e.preventDefault();

    setText("resumeName", document.getElementById("name").value);
    setText("resumeObjective", document.getElementById("objective").value);
    setText("resumePhone", document.getElementById("phone").value, "Phone: ");
    setText("resumeEmail", document.getElementById("email").value, "Email: ");
    setText("resumeLocation", document.getElementById("location").value, "Location: ");

    const linkedin = document.getElementById("linkedin").value.trim();
    document.getElementById("resumeLinkedin").innerHTML =
        linkedin ? `LinkedIn: <a href="${linkedin}" target="_blank">${linkedin}</a>` : "";

    setText("resumeEducation", document.getElementById("education").value);
    setText("resumeExperience", document.getElementById("experience").value);

    setList("skills", "resumeSkills");
    setList("certifications", "resumeCertifications");
    setList("languages", "resumeLanguages");

    const projects = document.getElementById("projects").value;
    document.getElementById("resumeProjects").innerHTML = formatProjects(projects);

    document.getElementById("resumeForm").style.display = "none";
    document.getElementById("resume").style.display = "block";
});

</script>

</body>
</html>
